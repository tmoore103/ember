name: Refresh inflation data

on:
  schedule:
    # Daily at 12:30 UTC (early morning Pacific). FRED/Zillow/EIA update on
    # their own cadences; a daily run keeps BLS + Ember current without churn.
    - cron: '30 12 * * *'
  workflow_dispatch:  # Manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch inflation components + rebuild index
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python scripts/fetch_inflation_data.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/inflation.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh inflation data"
            git push
          fi
